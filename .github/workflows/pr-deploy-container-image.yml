name: PRs » Push container image

on:
  workflow_run:
    workflows: ["Build » Container image"]
    types:
      - completed

jobs:
  container-image-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download docker image from GHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.id }}-image
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/build.tar

      - name: Fetch pr number from GHA
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.id }}-number
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read PR Number
        run: |
          echo "PR_NUMBER=$(cat pr_number.txt)" >> $GITHUB_ENV

      - name: Push PR image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/admin-interface:pr-${{ env.PR_NUMBER }}

      - name: Add comment
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-tag: container-image
          message: |
            Use `docker` or `podman` to test this pull request locally.

            Run test server using develop.opencast.org as backend:
            ```
            podman run --rm -it -p 127.0.0.1:3000:3000 ${{ steps.meta.outputs.tags }}
            ```

            Specify a different backend like stable.opencast.org:
            ```
            podman run --rm -it -p 127.0.0.1:3000:3000 -e PROXY_TARGET=https://stable.opencast.org ${{ steps.meta.outputs.tags }}
            ```

            It may take a few seconds for the interface to spin up.
            It will then be available at http://127.0.0.1:3000.
            For more options you can pass on to the proxy, take a look at the `README.md`.
